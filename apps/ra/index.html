<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>RA</title>
    <meta name="description" content="A pixel-art real-time strategy graphics test." />
    <meta name="theme-color" content="#1b2a16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RA" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23345427'/%3E%3Crect x='3' y='5' width='10' height='7' fill='%234f74a8'/%3E%3Crect x='3' y='5' width='10' height='2' fill='%2324231f'/%3E%3Crect x='3' y='10' width='10' height='2' fill='%2324231f'/%3E%3Crect x='6' y='7' width='4' height='3' fill='%238fb2dc'/%3E%3Crect x='10' y='8' width='5' height='1' fill='%232a2c2e'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <button type="button" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menu" title="Menu"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="2" width="9" height="2"/><rect x="1" y="5" width="9" height="2"/><rect x="1" y="8" width="9" height="2"/></svg></button>
      <div id="sel">Drag: select · Tap: move</div>
    </div>
    <div id="menu" hidden>
      <label class="ver">
        <span>Version</span>
        <select id="version">
          <option value="2">v2 · Isometric</option>
          <option value="1">v1 · Top-down</option>
        </select>
      </label>
      <button id="regen" type="button">New map</button>
    </div>
    <canvas id="mini" aria-label="Minimap: drag to spin the world, tap to jump there"></canvas>
    <div id="selBar" hidden>
      <span id="acts"></span>
      <button type="button" id="moreBtn" aria-pressed="false" title="Add to the selection"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="1" width="3" height="9"/><rect x="1" y="4" width="9" height="3"/></svg>More</button>
      <button type="button" id="clearBtn" title="Clear selection (Esc)"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="1" width="2" height="2"/><rect x="3" y="3" width="2" height="2"/><rect x="5" y="5" width="1" height="1"/><rect x="6" y="6" width="2" height="2"/><rect x="8" y="8" width="2" height="2"/><rect x="8" y="1" width="2" height="2"/><rect x="6" y="3" width="2" height="2"/><rect x="3" y="6" width="2" height="2"/><rect x="1" y="8" width="2" height="2"/></svg>Clear</button>
    </div>
    <nav id="toolbar" aria-label="Controls">
      <button type="button" data-mode="select" class="on" aria-pressed="true" title="Select (S)"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="1" width="1" height="8"/><rect x="3" y="2" width="1" height="6"/><rect x="4" y="3" width="1" height="5"/><rect x="5" y="4" width="1" height="3"/><rect x="6" y="5" width="1" height="2"/><rect x="7" y="6" width="1" height="1"/><rect x="5" y="7" width="1" height="1"/><rect x="6" y="8" width="1" height="2"/></svg><span>Select</span></button>
      <button type="button" data-mode="pan" aria-pressed="false" title="Pan (P)"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="5" y="0" width="1" height="11"/><rect x="0" y="5" width="11" height="1"/><rect x="4" y="1" width="3" height="1"/><rect x="4" y="9" width="3" height="1"/><rect x="1" y="4" width="1" height="3"/><rect x="9" y="4" width="1" height="3"/></svg><span>Pan</span></button>
      <i class="sep"></i>
      <button type="button" id="allBtn" title="Select everything on screen"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="3" height="1"/><rect x="0" y="0" width="1" height="3"/><rect x="8" y="0" width="3" height="1"/><rect x="10" y="0" width="1" height="3"/><rect x="0" y="10" width="3" height="1"/><rect x="0" y="8" width="1" height="3"/><rect x="8" y="10" width="3" height="1"/><rect x="10" y="8" width="1" height="3"/><rect x="3" y="3" width="2" height="2"/><rect x="6" y="3" width="2" height="2"/><rect x="3" y="6" width="2" height="2"/><rect x="6" y="6" width="2" height="2"/></svg><span>All</span></button>
    </nav>
    <div id="loading" hidden>Drawing…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
