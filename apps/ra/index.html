<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>RA</title>
    <meta name="description" content="A pixel-art real-time strategy graphics test." />
    <meta name="theme-color" content="#1b2a16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RA" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23345427'/%3E%3Crect x='3' y='5' width='10' height='7' fill='%234f74a8'/%3E%3Crect x='3' y='5' width='10' height='2' fill='%2324231f'/%3E%3Crect x='3' y='10' width='10' height='2' fill='%2324231f'/%3E%3Crect x='6' y='7' width='4' height='3' fill='%238fb2dc'/%3E%3Crect x='10' y='8' width='5' height='1' fill='%232a2c2e'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <button type="button" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menu" title="Menu"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="2" width="9" height="2"/><rect x="1" y="5" width="9" height="2"/><rect x="1" y="8" width="9" height="2"/></svg></button>
      <span id="credits" hidden><i class="coinIco"></i><span class="num"></span></span>
    </div>
    <div id="menu" hidden>
      <label class="ver">
        <span>Version</span>
        <select id="version">
          <option value="2">v2 · Isometric</option>
          <option value="1">v1 · Top-down</option>
        </select>
      </label>
      <button id="regen" type="button">New map</button>
      <a id="unitsLink" href="./units/">Units &amp; buildings</a>
    </div>
    <canvas id="mini" aria-label="Minimap: drag to spin the world, tap to jump there"></canvas>
    <div id="selBar" hidden>
      <div id="acts"></div>
      <div id="selMenu" role="toolbar" aria-label="Select units on screen" hidden>
        <span id="types"></span>
        <span id="noTypes" hidden>No units on screen</span>
        <button type="button" id="allBtn" title="Select every unit on screen (Ctrl+A)"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="3" height="1"/><rect x="0" y="0" width="1" height="3"/><rect x="8" y="0" width="3" height="1"/><rect x="10" y="0" width="1" height="3"/><rect x="0" y="10" width="3" height="1"/><rect x="0" y="8" width="1" height="3"/><rect x="8" y="10" width="3" height="1"/><rect x="10" y="8" width="1" height="3"/><rect x="3" y="3" width="2" height="2"/><rect x="6" y="3" width="2" height="2"/><rect x="3" y="6" width="2" height="2"/><rect x="6" y="6" width="2" height="2"/></svg>All</button>
        <button type="button" id="clearBtn" title="Clear selection (Esc)"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="1" width="2" height="2"/><rect x="3" y="3" width="2" height="2"/><rect x="5" y="5" width="1" height="1"/><rect x="6" y="6" width="2" height="2"/><rect x="8" y="8" width="2" height="2"/><rect x="8" y="1" width="2" height="2"/><rect x="6" y="3" width="2" height="2"/><rect x="3" y="6" width="2" height="2"/><rect x="1" y="8" width="2" height="2"/></svg>Clear</button>
      </div>
    </div>
    <div id="confirm" hidden>
      <div id="okRing"></div>
      <button type="button" id="okBtn" aria-label="Send them here (clear the selection to call it off)" title="Send them here"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="5" width="2" height="2"/><rect x="3" y="7" width="2" height="2"/><rect x="5" y="5" width="2" height="2"/><rect x="7" y="3" width="2" height="2"/><rect x="9" y="1" width="1" height="2"/></svg></button>
    </div>
    <nav id="toolbar" aria-label="Controls">
      <button type="button" id="selectBtn" aria-pressed="false" aria-controls="selMenu" title="Select units (Q)"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="1" width="1" height="8"/><rect x="3" y="2" width="1" height="6"/><rect x="4" y="3" width="1" height="5"/><rect x="5" y="4" width="1" height="3"/><rect x="6" y="5" width="1" height="2"/><rect x="7" y="6" width="1" height="1"/><rect x="5" y="7" width="1" height="1"/><rect x="6" y="8" width="1" height="2"/></svg><span>Select</span></button>
      <button type="button" id="homeBtn" title="Back to your base (H)"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="5" y="0" width="1" height="1"/><rect x="4" y="1" width="3" height="1"/><rect x="3" y="2" width="5" height="1"/><rect x="2" y="3" width="7" height="1"/><rect x="1" y="4" width="9" height="1"/><rect x="0" y="5" width="11" height="1"/><rect x="1" y="6" width="3" height="5"/><rect x="7" y="6" width="3" height="5"/><rect x="4" y="6" width="3" height="2"/><rect x="8" y="1" width="2" height="3"/></svg><span>Home</span></button>
      <i class="sep" id="buildSep" hidden></i>
      <button type="button" id="buildBtn" aria-pressed="false" title="Build (B)" hidden><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="1" width="6" height="3"/><rect x="0" y="2" width="1" height="2"/><rect x="7" y="2" width="2" height="1"/><rect x="4" y="4" width="2" height="7"/></svg><span>Build</span></button>
    </nav>
    <div id="build" hidden>
      <div class="head"><span class="credits" title="Credits"><i class="coinIco"></i><span class="num"></span></span><button type="button" class="close" aria-label="Close" title="Close (B)"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="1" width="2" height="2"/><rect x="3" y="3" width="2" height="2"/><rect x="5" y="5" width="1" height="1"/><rect x="6" y="6" width="2" height="2"/><rect x="8" y="8" width="2" height="2"/><rect x="8" y="1" width="2" height="2"/><rect x="6" y="3" width="2" height="2"/><rect x="3" y="6" width="2" height="2"/><rect x="1" y="8" width="2" height="2"/></svg></button></div>
      <div class="body">
        <div class="pwr" role="meter" aria-label="Power"><i class="boltIco"></i><div class="track"><div class="fill"></div><div class="use"></div></div></div>
        <div class="main">
          <div class="tabs" role="tablist" aria-label="Build menu"></div>
          <div class="grid"></div>
        </div>
      </div>
    </div>
    <div id="picker" hidden>
      <div class="box" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
        <div class="head">
          <span class="title" id="pickTitle">Choose a map</span>
          <a id="unitsBtn" href="./units/" title="See every unit and building"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="1" width="4" height="4"/><rect x="6" y="1" width="4" height="4"/><rect x="1" y="6" width="4" height="4"/><rect x="6" y="6" width="4" height="4"/></svg>Units</a>
          <button type="button" id="reroll" title="Show other versions of these maps"><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="1" width="5" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="8" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="5"/><rect x="9" y="3" width="1" height="2"/><rect x="7" y="4" width="4" height="1"/><rect x="8" y="5" width="2" height="1"/><rect x="2" y="8" width="1" height="1"/><rect x="8" y="8" width="1" height="1"/><rect x="3" y="9" width="5" height="1"/><rect x="9" y="7" width="1" height="1"/></svg>Shuffle</button>
          <button type="button" class="close" id="pickClose" aria-label="Close" title="Close" hidden><svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="1" width="2" height="2"/><rect x="3" y="3" width="2" height="2"/><rect x="5" y="5" width="1" height="1"/><rect x="6" y="6" width="2" height="2"/><rect x="8" y="8" width="2" height="2"/><rect x="8" y="1" width="2" height="2"/><rect x="6" y="3" width="2" height="2"/><rect x="3" y="6" width="2" height="2"/><rect x="1" y="8" width="2" height="2"/></svg></button>
        </div>
        <div class="stages" role="radiogroup" aria-label="Stage"><span class="label">Stage</span><span class="seg"></span><span class="blurb"></span></div>
        <div class="maps"></div>
        <div class="hint"><i class="you"></i> You start here · <i class="foe"></i> Enemy base</div>
      </div>
    </div>
    <div id="build-no" aria-hidden="true" hidden></div>
    <div id="toast" hidden></div>
    <div id="loading" hidden>Drawing…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
