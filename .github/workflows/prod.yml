name: prod

# Every push to main deploys each app that changed since its deployed/<name> tag.
# A failed deploy leaves the tag where it was, so the next push to main retries it.
# Apps deployed from the next branch (deploy-next.yml) are skipped until next is merged into main.

on:
  push:
    branches: [main]

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          git fetch --tags --force origin
          apps=$(node scripts/changed-apps.mjs --deployed)
          # An app last deployed from the next branch (deploy-next.yml) has its deployed/<name> tag on a
          # commit main doesn't have yet. Deploying main would put the older code back on its prod
          # domain, so leave it to next until next is merged into main.
          keep=()
          for app in $(echo "$apps" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).join(" "))'); do
            if git rev-parse --verify --quiet "refs/tags/deployed/$app" >/dev/null && ! git merge-base --is-ancestor "deployed/$app" HEAD; then
              echo "::notice::$app: skipped, its prod domain is deployed from next (deployed/$app is not on main)"
            else
              keep+=("$app")
            fi
          done
          apps=$(node -e 'console.log(JSON.stringify(process.argv.slice(1)))' "${keep[@]}")
          echo "Apps to deploy: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: ${{ matrix.app }}
      target: prod
      # After the prod deploy, the same job rebuilds each Hosting app with the preview environment
      # and puts it on the app's fixed "latest" preview link, so that link also tracks main.
      # (One job instead of a second deploy-app run: Actions bills every job as at least a minute.)
      # App Hosting apps are skipped.
      with_latest: true
    secrets: inherit
    permissions:
      contents: write
      statuses: write
      pull-requests: write
