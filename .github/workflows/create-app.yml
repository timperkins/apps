name: create-app

# Creates the Google-side resources for a new app, using the deploy service account:
# Hosting site or App Hosting backends, Firestore databases, custom domain, DNS records
# and Auth authorized domain. Safe to re-run; existing resources are left alone.
# Scaffold the folder itself with scripts/new-app.mjs.
# preview.yml calls this for every app a branch adds, with the inputs read from its app.json,
# so it only needs running by hand for apps added before that, or to change a setting.

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      type:
        type: string
        default: hosting
      firestore:
        type: boolean
        default: false
      attach_domain:
        type: boolean
        default: true
      domain:
        type: string
        required: false
      ttl_collections:
        type: string
        required: false
      firestore_location:
        type: string
        default: nam5
      region:
        type: string
        default: us-central1
  workflow_dispatch:
    inputs:
      name:
        description: App folder name under apps/ (lowercase, dashes)
        type: string
        required: true
      type:
        type: choice
        options: [hosting, apphosting]
        default: hosting
      firestore:
        description: Create the Firestore databases (names from app.json's firestore field if the app folder exists, else <name> and <name>-preview)
        type: boolean
        default: false
      attach_domain:
        description: Attach the custom domain and write its DNS records (turn off to create the site first and cut a domain over later)
        type: boolean
        default: true
      domain:
        description: "Custom domain (default: <name>.trom.dev)"
        type: string
        required: false
      ttl_collections:
        description: "Firestore collection groups whose documents expire at their expiresAt field, space-separated (e.g. rooms players rtc). Needs firestore."
        type: string
        required: false
      firestore_location:
        type: string
        default: nam5
      region:
        description: App Hosting region
        type: string
        default: us-central1

env:
  FIREBASE_PROJECT: apps-97595
  RUN: ${{ github.workspace }}/scripts/ci-run.sh
  FIREBASE_TOOLS: firebase-tools@15.34.1
  DNS_ZONE: trom-dev
  NAME: ${{ inputs.name }}
  DOMAIN: ${{ inputs.domain || format('{0}.trom.dev', inputs.name) }}
  REGION: ${{ inputs.region }}
  DB_LOCATION: ${{ inputs.firestore_location }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check name
        run: |
          [[ "$NAME" =~ ^[a-z][a-z0-9-]{1,28}[a-z0-9]$ ]] || { echo "::error::Bad app name: $NAME"; exit 1; }
          case '${{ inputs.type }}' in hosting|apphosting) ;; *) echo "::error::Bad app type: ${{ inputs.type }}"; exit 1 ;; esac
          # Backend names from app.json when the app folder exists (an app can keep an older backend,
          # or have no preview backend), else <name> and <name>-preview.
          app="apps/$NAME/app.json"
          if [ -f "$app" ]; then
            backend=$(jq -r '.backend // empty' "$app"); preview=$(jq -r '.previewBackend // empty' "$app")
          else
            backend="$NAME"; preview="$NAME-preview"
          fi
          { echo "BACKEND=$backend"; echo "PREVIEW_BACKEND=$preview"; echo "BACKENDS=$backend $preview"; } >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hosting site
        if: inputs.type == 'hosting'
        run: |
          site="trom-$NAME"
          if npx -y "$FIREBASE_TOOLS" hosting:sites:get "$site" --project "$FIREBASE_PROJECT" > /dev/null 2>&1; then
            echo "Hosting site $site already exists"
          else
            "$RUN" npx -y "$FIREBASE_TOOLS" hosting:sites:create "$site" --project "$FIREBASE_PROJECT" --non-interactive
          fi

      - name: App Hosting backends
        if: inputs.type == 'apphosting'
        run: |
          for backend in $BACKENDS; do
            # backends:get exits 0 with a warning when the backend is missing, so check its JSON.
            if npx -y "$FIREBASE_TOOLS" apphosting:backends:get "$backend" --project "$FIREBASE_PROJECT" --json 2> /dev/null \
              | jq -e '.result.name' > /dev/null; then
              echo "Backend $backend already exists"
            else
              "$RUN" npx -y "$FIREBASE_TOOLS" apphosting:backends:create --non-interactive --project "$FIREBASE_PROJECT" \
                --backend "$backend" --primary-region "$REGION" --root-dir "apps/$NAME"
            fi
          done
          {
            echo "### Finish in the Firebase console (App Hosting)"
            echo "- Connect both backends to \`$GITHUB_REPOSITORY\` with root directory \`apps/$NAME\` if they are not connected."
            echo "- Turn **automatic rollouts off** on both, so CI is the only trigger."
            if [ -n "$PREVIEW_BACKEND" ]; then
              echo "- Set the environment name of \`$PREVIEW_BACKEND\` to \`preview\` so \`apphosting.preview.yaml\` applies."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Needs Secret Manager Admin on the service account. A failure here doesn't stop the rest:
      # a backend that already had access keeps it.
      - name: App Hosting secret access
        if: inputs.type == 'apphosting'
        continue-on-error: true
        run: |
          # Every secret named in the app's apphosting*.yaml files, granted to both backends.
          secrets=$(cat apps/"$NAME"/apphosting*.yaml 2>/dev/null | sed -nE 's/^[[:space:]]*secret:[[:space:]]*([A-Za-z0-9_-]+).*/\1/p' | sort -u)
          for secret in $secrets; do
            for backend in $BACKENDS; do
              "$RUN" npx -y "$FIREBASE_TOOLS" apphosting:secrets:grantaccess "$secret" \
                --backend "$backend" --project "$FIREBASE_PROJECT"
              echo "::notice title=secrets::$secret granted to $backend"
            done
          done

      - name: Firestore databases
        if: inputs.firestore
        run: |
          dbs="$NAME $NAME-preview"
          if [ -f "apps/$NAME/app.json" ] && jq -e .firestore "apps/$NAME/app.json" > /dev/null; then
            dbs=$(jq -r '.firestore.prod + " " + .firestore.preview' "apps/$NAME/app.json")
          fi
          for db in $dbs; do
            if npx -y "$FIREBASE_TOOLS" firestore:databases:get "$db" --project "$FIREBASE_PROJECT" > /dev/null 2>&1; then
              echo "Database $db already exists"
            else
              "$RUN" npx -y "$FIREBASE_TOOLS" firestore:databases:create "$db" --location "$DB_LOCATION" --project "$FIREBASE_PROJECT"
            fi
          done

      # Firestore deletes a document in these collection groups once its expiresAt time has passed.
      - name: Firestore TTL policies
        if: inputs.firestore && inputs.ttl_collections != ''
        env:
          TTL_COLLECTIONS: ${{ inputs.ttl_collections }}
        run: |
          dbs="$NAME $NAME-preview"
          if [ -f "apps/$NAME/app.json" ] && jq -e .firestore "apps/$NAME/app.json" > /dev/null; then
            dbs=$(jq -r '.firestore.prod + " " + .firestore.preview' "apps/$NAME/app.json")
          fi
          for group in $TTL_COLLECTIONS; do
            [[ "$group" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]] || { echo "::error::Bad collection group: $group"; exit 1; }
          done
          for db in $dbs; do
            for group in $TTL_COLLECTIONS; do
              "$RUN" gcloud firestore fields ttls update expiresAt --collection-group="$group" --database="$db" \
                --enable-ttl --async --quiet --project="$FIREBASE_PROJECT"
              echo "::notice title=ttl::$db/$group expires documents at expiresAt"
            done
          done

      - name: Custom domain, DNS and Auth
        if: inputs.attach_domain
        run: |
          if [ '${{ inputs.type }}' = hosting ]; then
            "$RUN" node scripts/attach-domain.mjs --domain "$DOMAIN" --hosting-site "trom-$NAME"
          else
            # Use the backend's own region; an existing backend may not be in the default one.
            region=$(npx -y "$FIREBASE_TOOLS" apphosting:backends:get "$BACKEND" --project "$FIREBASE_PROJECT" --json \
              | jq -r '[.. | objects | .name? | strings | capture("/locations/(?<r>[^/]+)/backends/").r][0] // empty')
            echo "::notice title=region::$BACKEND is in ${region:-$REGION}"
            "$RUN" node scripts/attach-domain.mjs --domain "$DOMAIN" --backend "$BACKEND" --region "${region:-$REGION}"
            # Let sign-in work on the preview backend's own URL too.
            host=
            if [ -n "$PREVIEW_BACKEND" ]; then
              host=$(npx -y "$FIREBASE_TOOLS" apphosting:backends:get "$PREVIEW_BACKEND" --project "$FIREBASE_PROJECT" --json \
                | jq -r '[.. | objects | .uri? | strings][0] // empty' | sed -E 's#^https?://##; s#/.*$##')
            fi
            if [ -n "$host" ]; then "$RUN" node scripts/attach-domain.mjs --domain "$host" --authorize-only; fi
          fi
          echo "Done: https://$DOMAIN (the certificate can take up to an hour)" >> "$GITHUB_STEP_SUMMARY"
