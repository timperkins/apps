name: deploy-app

# Builds and deploys one app. Called by preview.yml and prod.yml, and run by hand for
# redeploys and rollbacks (Actions > deploy-app > Run workflow).

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      target:
        description: prod or preview
        type: string
        required: true
      ref:
        description: Branch, tag or commit to deploy (default the triggering commit)
        type: string
        required: false
  workflow_dispatch:
    inputs:
      app:
        description: App folder name under apps/
        type: string
        required: true
      target:
        type: choice
        options: [preview, prod]
        default: preview
      ref:
        description: "Branch, tag or commit to deploy (default: the branch you run this from). App Hosting previews need a branch."
        type: string
        required: false

env:
  FIREBASE_PROJECT: apps-97595
  RUN: ${{ github.workspace }}/scripts/ci-run.sh
  FIREBASE_TOOLS: firebase-tools@15.34.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # move the deployed/<app> tag
      statuses: write # preview link on the commit
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.target }}-${{ inputs.ref || github.ref_name }}
      cancel-in-progress: ${{ inputs.target == 'preview' }}
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read app.json
        id: app
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          test -f app.json || { echo "::error::apps/${{ inputs.app }}/app.json not found"; exit 1; }
          {
            echo "type=$(jq -r .type app.json)"
            echo "domain=$(jq -r '.domain // empty' app.json)"
            echo "site=$(jq -r '.hostingSite // empty' app.json)"
            echo "backend=$(jq -r '.backend // empty' app.json)"
            echo "preview_backend=$(jq -r '.previewBackend // empty' app.json)"
            # An app without a preview database (single-user tools) builds its previews against prod.
            echo "database=$(jq -r --arg t '${{ inputs.target }}' '.firestore[$t] // .firestore.prod // empty' app.json)"
            # The database that belongs to this target. Rules are deployed only to this one.
            echo "own_database=$(jq -r --arg t '${{ inputs.target }}' '.firestore[$t] // empty' app.json)"
            echo "jobs=$(jq -c '.jobs // []' app.json)"
            echo "job_service_account=$(jq -r '.jobServiceAccount // empty' app.json)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          # Preview channel ID from the branch name: lowercase, dashes, short enough for a DNS label.
          site=$(jq -r '.hostingSite // ""' app.json)
          max=$(( 50 - ${#site} ))
          channel=$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-$max | sed -E 's/-+$//')
          echo "channel=${channel:-preview}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Static apps on Firebase Hosting

      - uses: actions/setup-node@v4
        if: steps.app.outputs.type == 'hosting'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/package-lock.json

      - name: Install and check
        if: steps.app.outputs.type == 'hosting'
        run: |
          "$RUN" npm ci
          "$RUN" npm run typecheck --if-present
          "$RUN" npm run lint --if-present
          if jq -e '.scripts.test' package.json > /dev/null; then "$RUN" npm test; fi

      - name: Build
        if: steps.app.outputs.type == 'hosting'
        env:
          VITE_APP_ENV: ${{ inputs.target }}
          VITE_FIRESTORE_DATABASE_ID: ${{ steps.app.outputs.database }}
          NEXT_PUBLIC_APP_ENV: ${{ inputs.target }}
          NEXT_PUBLIC_FIRESTORE_DATABASE_ID: ${{ steps.app.outputs.database }}
        run: '"$RUN" npm run build'

      # Rules and indexes go only to the database for this target, so a branch never changes prod rules.
      - name: Deploy Firestore rules (preview database)
        if: steps.app.outputs.type == 'hosting' && inputs.target == 'preview' && steps.app.outputs.own_database != ''
        run: |
          "$RUN" npx -y "$FIREBASE_TOOLS" deploy --only 'firestore:${{ steps.app.outputs.own_database }}' \
            --project "$FIREBASE_PROJECT" --force

      - name: Deploy preview channel
        id: hosting_preview
        if: steps.app.outputs.type == 'hosting' && inputs.target == 'preview'
        run: |
          npx -y "$FIREBASE_TOOLS" hosting:channel:deploy '${{ steps.app.outputs.channel }}' \
            --project "$FIREBASE_PROJECT" --expires 7d --json > "$RUNNER_TEMP/channel.json" 2> "$RUNNER_TEMP/channel.err" || {
            cat "$RUNNER_TEMP/channel.json" "$RUNNER_TEMP/channel.err"
            msg=$(jq -r '.error // empty' "$RUNNER_TEMP/channel.json" 2>/dev/null)
            [ -n "$msg" ] || msg=$(grep -v '^npm warn' "$RUNNER_TEMP/channel.err" | tail -n 20)
            echo "::error title=hosting:channel:deploy failed::$(echo "${msg:-no output}" | tr '\n' ' ')"
            exit 1
          }
          url=$(jq -r '.result | to_entries[0].value.url' "$RUNNER_TEMP/channel.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The same build also goes to a fixed "latest" channel, so each app has one preview link that
      # never changes and always shows the most recent preview push from any branch (last push wins).
      # Channels last at most 30 days; every deploy resets that, and preview-keepalive.yml extends it weekly.
      - name: Deploy fixed latest channel
        id: hosting_latest
        if: steps.app.outputs.type == 'hosting' && inputs.target == 'preview'
        continue-on-error: true
        run: |
          npx -y "$FIREBASE_TOOLS" hosting:channel:deploy latest \
            --project "$FIREBASE_PROJECT" --expires 30d --json > "$RUNNER_TEMP/latest.json" 2> "$RUNNER_TEMP/latest.err" || {
            cat "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/latest.err"
            echo "::warning title=latest channel::deploy to the fixed latest channel failed"
            exit 1
          }
          url=$(jq -r '.result | to_entries[0].value.url' "$RUNNER_TEMP/latest.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy to prod
        id: hosting_prod
        if: steps.app.outputs.type == 'hosting' && inputs.target == 'prod'
        run: |
          only=hosting
          if [ -n '${{ steps.app.outputs.database }}' ]; then only='hosting,firestore:${{ steps.app.outputs.database }}'; fi
          "$RUN" npx -y "$FIREBASE_TOOLS" deploy --only "$only" --project "$FIREBASE_PROJECT" --force \
            --message "${{ inputs.app }} ${{ steps.app.outputs.sha }}"
          echo "url=https://${{ steps.app.outputs.domain }}" >> "$GITHUB_OUTPUT"

      # Apps with server code on Firebase App Hosting

      # An App Hosting app without a previewBackend in app.json gets no preview.
      - name: Deploy Firestore rules (App Hosting)
        if: >-
          steps.app.outputs.type == 'apphosting' && steps.app.outputs.own_database != ''
          && (inputs.target == 'prod' || steps.app.outputs.preview_backend != '')
        run: |
          "$RUN" npx -y "$FIREBASE_TOOLS" deploy --only 'firestore:${{ steps.app.outputs.own_database }}' \
            --project "$FIREBASE_PROJECT" --force

      # Cloud Run jobs listed in app.json's "jobs" (see docs/PLAN.md). Each is built from
      # jobs/<name>/Dockerfile, pushed to Artifact Registry and deployed as <app>-<name> for prod or
      # <app>-<name>-preview for previews, before the app rolls out so the app can start it.
      # One-time setup per app: scripts/setup-jobs.sh.
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.app.outputs.jobs != '[]'

      - name: Cloud Run jobs
        if: steps.app.outputs.jobs != '[]'
        env:
          APP: ${{ inputs.app }}
          JOBS: ${{ steps.app.outputs.jobs }}
          JOB_SA: ${{ steps.app.outputs.job_service_account }}
          SHA: ${{ steps.app.outputs.sha }}
          SUFFIX: ${{ inputs.target == 'preview' && '-preview' || '' }}
          REGION: us-central1
        run: |
          echo "::notice title=jobs::deploying as $(gcloud config get-value account 2>/dev/null)"
          [ -n "$JOB_SA" ] || { echo "::error::app.json has jobs but no jobServiceAccount"; exit 1; }
          registry="$REGION-docker.pkg.dev"
          "$RUN" gcloud auth configure-docker "$registry" --quiet
          for row in $(echo "$JOBS" | jq -c '.[]'); do
            job=$(jq -r '.name' <<< "$row")
            [[ "$job" =~ ^[a-z][a-z0-9-]{0,30}$ ]] || { echo "::error::Bad job name: $job"; exit 1; }
            [ -f "jobs/$job/Dockerfile" ] || { echo "::error::jobs/$job/Dockerfile not found"; exit 1; }
            image="$registry/$FIREBASE_PROJECT/apps/$APP-$job:$SHA"
            env_vars=$(jq -r --arg t '${{ inputs.target }}' \
              '(.env // {}) + {APP_ENV: $t} | to_entries | map("\(.key)=\(.value)") | join(",")' <<< "$row")
            # Secret Manager secrets as env vars: {"GEMINI_API_KEY": "video-gemini-api-key"}.
            secrets=$(jq -r '(.secrets // {}) | to_entries | map("\(.key)=\(.value):latest") | join(",")' <<< "$row")
            secret_flag=(--clear-secrets)
            [ -z "$secrets" ] || secret_flag=(--set-secrets "$secrets")
            "$RUN" docker build -t "$image" "jobs/$job"
            "$RUN" docker push "$image"
            "$RUN" gcloud run jobs deploy "$APP-$job$SUFFIX" --image "$image" \
              --region "$REGION" --project "$FIREBASE_PROJECT" --service-account "$JOB_SA" \
              --cpu "$(jq -r '.cpu // "1"' <<< "$row")" --memory "$(jq -r '.memory // "2Gi"' <<< "$row")" \
              --task-timeout "$(jq -r '.timeout // "3600s"' <<< "$row")" \
              --tasks 1 --max-retries "$(jq -r '.maxRetries // 1' <<< "$row")" \
              --set-env-vars "$env_vars" "${secret_flag[@]}" --quiet
            echo "::notice title=jobs::$APP-$job$SUFFIX deployed from $image"
          done

      - name: Roll out App Hosting
        id: apphosting
        if: steps.app.outputs.type == 'apphosting'
        env:
          BRANCH: ${{ inputs.ref || github.ref_name }}
        run: |
          if [ '${{ inputs.target }}' = prod ]; then
            backend='${{ steps.app.outputs.backend }}'
            "$RUN" npx -y "$FIREBASE_TOOLS" apphosting:rollouts:create "$backend" \
              --git-commit '${{ steps.app.outputs.sha }}' --force --project "$FIREBASE_PROJECT"
            echo "url=https://${{ steps.app.outputs.domain }}" >> "$GITHUB_OUTPUT"
          elif [ -z '${{ steps.app.outputs.preview_backend }}' ]; then
            echo "::notice title=${{ inputs.app }}::No previewBackend in app.json, so there is no preview"
            echo "note=no preview backend" >> "$GITHUB_OUTPUT"
          else
            backend='${{ steps.app.outputs.preview_backend }}'
            "$RUN" npx -y "$FIREBASE_TOOLS" apphosting:rollouts:create "$backend" \
              --git-branch "$BRANCH" --force --project "$FIREBASE_PROJECT"
            uri=$(npx -y "$FIREBASE_TOOLS" apphosting:backends:get "$backend" --project "$FIREBASE_PROJECT" --json \
              | jq -r '[.. | objects | .uri? | strings][0] // empty')
            case "$uri" in http*) ;; ?*) uri="https://$uri" ;; esac
            echo "url=$uri" >> "$GITHUB_OUTPUT"
          fi

      # Report

      - name: Report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.hosting_preview.outputs.url || steps.hosting_prod.outputs.url || steps.apphosting.outputs.url }}
          NOTE: ${{ steps.apphosting.outputs.note }}
          LATEST: ${{ steps.hosting_latest.outputs.url }}
        run: |
          echo "- **${{ inputs.app }}** (${{ inputs.target }}): ${URL:-$NOTE}" >> "$GITHUB_STEP_SUMMARY"
          [ -z "$LATEST" ] || echo "  - fixed link (always the latest preview): $LATEST" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ inputs.app }}: ${URL:-$NOTE}${LATEST:+ (fixed: $LATEST)}"
          mkdir -p "$RUNNER_TEMP/link"
          jq -n --arg app '${{ inputs.app }}' --arg url "$URL" --arg note "$NOTE" --arg latest "$LATEST" \
            '{app: $app, url: $url, note: $note, latest: $latest}' > "$RUNNER_TEMP/link/${{ inputs.app }}.json"
          if [ '${{ inputs.target }}' = preview ] && [ -n "$URL" ]; then
            gh api "repos/${{ github.repository }}/statuses/${{ steps.app.outputs.sha }}" \
              -f state=success -f context='preview/${{ inputs.app }}' -f target_url="$URL" \
              -f description='Preview deployed' > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: link-${{ inputs.app }}
          path: ${{ runner.temp }}/link/${{ inputs.app }}.json
          retention-days: 7

      - name: Move deployed tag
        if: inputs.target == 'prod'
        run: |
          tag='deployed/${{ inputs.app }}'
          git tag -f "$tag" '${{ steps.app.outputs.sha }}'
          git push -f origin "refs/tags/$tag"
