name: deploy-app

# Builds and deploys one app. Called by preview.yml and prod.yml, and run by hand for
# redeploys and rollbacks (Actions > deploy-app > Run workflow).

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      target:
        description: prod or preview
        type: string
        required: true
      ref:
        description: Branch, tag or commit to deploy (default the triggering commit)
        type: string
        required: false
      latest_only:
        description: Preview only. Deploy just the fixed latest channel (no branch channel).
        type: boolean
        required: false
        default: false
      with_latest:
        description: >-
          Prod only. After the prod deploy, rebuild with the preview environment in the same job and put it
          on the fixed "latest" preview link, so that link also tracks main. Used by prod.yml after a merge.
        type: boolean
        required: false
        default: false
      pr_comment:
        description: Preview only. Add this app's links to the branch PR's preview-links comment. Used by preview.yml.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      app:
        description: App folder name under apps/
        type: string
        required: true
      target:
        type: choice
        options: [preview, prod]
        default: preview
      ref:
        description: "Branch, tag or commit to deploy (default: the branch you run this from). App Hosting previews need a branch."
        type: string
        required: false
      latest_only:
        description: Preview only. Deploy just the fixed latest channel
        type: boolean
        default: false

env:
  FIREBASE_PROJECT: apps-97595
  RUN: ${{ github.workspace }}/scripts/ci-run.sh
  FIREBASE_TOOLS: firebase-tools@15.34.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # move the deployed/<app> tag
      statuses: write # preview link on the commit
      pull-requests: write # the PR number shown as the build's version, and the preview-links comment
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.target }}-${{ inputs.ref || github.ref_name }}
      cancel-in-progress: ${{ inputs.target == 'preview' }}
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read app.json
        id: app
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          test -f app.json || { echo "::error::apps/${{ inputs.app }}/app.json not found"; exit 1; }
          {
            echo "type=$(jq -r .type app.json)"
            echo "domain=$(jq -r '.domain // empty' app.json)"
            echo "site=$(jq -r '.hostingSite // empty' app.json)"
            echo "backend=$(jq -r '.backend // empty' app.json)"
            echo "preview_backend=$(jq -r '.previewBackend // empty' app.json)"
            # Optional own Hosting site (and custom domain) for the fixed preview link, e.g. ra-preview.trom.dev.
            echo "preview_site=$(jq -r '.previewSite // empty' app.json)"
            echo "preview_domain=$(jq -r '.previewDomain // empty' app.json)"
            # An app without a preview database (single-user tools) builds its previews against prod.
            echo "database=$(jq -r --arg t '${{ inputs.target }}' '.firestore[$t] // .firestore.prod // empty' app.json)"
            # The database that belongs to this target. Rules are deployed only to this one.
            echo "own_database=$(jq -r --arg t '${{ inputs.target }}' '.firestore[$t] // empty' app.json)"
            # The same two for the preview environment, used by with_latest on prod.
            echo "preview_database=$(jq -r '.firestore.preview // .firestore.prod // empty' app.json)"
            echo "preview_own_database=$(jq -r '.firestore.preview // empty' app.json)"
            echo "jobs=$(jq -c '.jobs // []' app.json)"
            echo "job_service_account=$(jq -r '.jobServiceAccount // empty' app.json)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          # Preview channel ID from the branch name: lowercase, dashes, short enough for a DNS label.
          site=$(jq -r '.hostingSite // ""' app.json)
          max=$(( 50 - ${#site} ))
          channel=$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-$max | sed -E 's/-+$//')
          echo "channel=${channel:-preview}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Static apps on Firebase Hosting

      - uses: actions/setup-node@v4
        if: steps.app.outputs.type == 'hosting'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/package-lock.json

      - name: Install and check
        if: steps.app.outputs.type == 'hosting'
        run: |
          "$RUN" npm ci
          "$RUN" npm run typecheck --if-present
          "$RUN" npm run lint --if-present
          if jq -e '.scripts.test' package.json > /dev/null; then "$RUN" npm test; fi

      # The newest PR in this build, shown by apps as a version label: the PR this commit belongs to
      # (the merged PR on main, or the open PR on a branch), else the last PR merged into main.
      - name: Find PR number
        id: pr
        if: steps.app.outputs.type == 'hosting'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.app.outputs.sha }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          [ -n "$pr" ] || pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=30" \
            --jq '[.[] | select(.merged_at)] | sort_by(.merged_at) | last | .number // empty' 2>/dev/null || true)
          echo "PR: ${pr:-none}"
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.app.outputs.type == 'hosting'
        env:
          VITE_PR_NUMBER: ${{ steps.pr.outputs.number }}
          NEXT_PUBLIC_PR_NUMBER: ${{ steps.pr.outputs.number }}
          VITE_APP_ENV: ${{ inputs.target }}
          VITE_FIRESTORE_DATABASE_ID: ${{ steps.app.outputs.database }}
          NEXT_PUBLIC_APP_ENV: ${{ inputs.target }}
          NEXT_PUBLIC_FIRESTORE_DATABASE_ID: ${{ steps.app.outputs.database }}
        run: '"$RUN" npm run build'

      # Rules and indexes go only to the database for this target, so a branch never changes prod rules.
      - name: Deploy Firestore rules (preview database)
        if: steps.app.outputs.type == 'hosting' && inputs.target == 'preview' && steps.app.outputs.own_database != ''
        run: |
          "$RUN" npx -y "$FIREBASE_TOOLS" deploy --only 'firestore:${{ steps.app.outputs.own_database }}' \
            --project "$FIREBASE_PROJECT" --force

      # Firebase caps preview channels (the quota counts every site in the project), and each branch
      # push makes one that lives 7 days. Before deploying, delete expiring channels on every site whose
      # branch has no open PR (merged or abandoned branches), keeping live, latest and this branch's
      # channel. Uses the REST API, since hosting:channel:list misses most channels. Failures only warn.
      - name: Prune old preview channels
        if: steps.app.outputs.type == 'hosting' && inputs.target == 'preview' && !inputs.latest_only
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.app.outputs.channel }}
        run: |
          api=https://firebasehosting.googleapis.com/v1beta1
          token=$(gcloud auth print-access-token) || { echo "::warning::No access token for pruning"; exit 0; }
          get() { curl -sS -H "Authorization: Bearer $token" -H "x-goog-user-project: $FIREBASE_PROJECT" "$1"; }
          refs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate --jq '.[].head.ref')
          sites=$(get "$api/projects/$FIREBASE_PROJECT/sites?pageSize=100" | jq -r '.sites[]?.name | split("/") | last')
          total=0; n=0; summary=""
          for site in $sites; do
            max=$(( 50 - ${#site} ))
            keep=$(printf '%s\n' $refs | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-$max | sed -E 's/-+$//')
            keep=$(printf '%s\n' live latest "$CURRENT" $keep)
            ids=""; page=""
            while :; do
              get "$api/sites/$site/channels?pageSize=100${page:+&pageToken=$page}" > "$RUNNER_TEMP/channels.json"
              ids="$ids $(jq -r '.channels[]? | select(.expireTime) | .name | split("/") | last' "$RUNNER_TEMP/channels.json")"
              page=$(jq -r '.nextPageToken // empty' "$RUNNER_TEMP/channels.json")
              [ -n "$page" ] || break
            done
            count=$(echo $ids | wc -w); total=$((total + count)); summary="$summary $site:$count"
            for id in $ids; do
              grep -qxF "$id" <<< "$keep" && continue
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $token" \
                -H "x-goog-user-project: $FIREBASE_PROJECT" "$api/sites/$site/channels/$id")
              if [ "$code" = 200 ]; then n=$((n + 1)); else echo "::warning::Could not delete channel $site/$id (HTTP $code)"; fi
            done
          done
          echo "::notice title=Preview channels::$total expiring channels ($summary ), deleted $n"

      - name: Deploy preview channel
        id: hosting_preview
        if: steps.app.outputs.type == 'hosting' && inputs.target == 'preview' && !inputs.latest_only
        run: |
          npx -y "$FIREBASE_TOOLS" hosting:channel:deploy '${{ steps.app.outputs.channel }}' \
            --project "$FIREBASE_PROJECT" --expires 7d --json > "$RUNNER_TEMP/channel.json" 2> "$RUNNER_TEMP/channel.err" || {
            cat "$RUNNER_TEMP/channel.json" "$RUNNER_TEMP/channel.err"; echo
            msg=$(jq -r '.error // empty' "$RUNNER_TEMP/channel.json" 2>/dev/null || true)
            [ -n "$msg" ] || msg=$(grep -v '^npm warn' "$RUNNER_TEMP/channel.err" | tail -n 20)
            echo "::error title=hosting:channel:deploy failed::$(echo "${msg:-no output}" | tr '\n' ' ')"
            exit 1
          }
          url=$(jq -r '.result | to_entries[0].value.url // empty' "$RUNNER_TEMP/channel.json" 2>/dev/null || true)
          if [ -z "$url" ]; then
            echo "::error title=No preview URL in hosting:channel:deploy output::$(head -c 1500 "$RUNNER_TEMP/channel.json" | tr '\n' ' ') $(grep -v '^npm warn' "$RUNNER_TEMP/channel.err" | tail -n 10 | tr '\n' ' ')"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy to prod
        id: hosting_prod
        if: steps.app.outputs.type == 'hosting' && inputs.target == 'prod'
        run: |
          only=hosting
          if [ -n '${{ steps.app.outputs.database }}' ]; then only='hosting,firestore:${{ steps.app.outputs.database }}'; fi
          "$RUN" npx -y "$FIREBASE_TOOLS" deploy --only "$only" --project "$FIREBASE_PROJECT" --force \
            --message "${{ inputs.app }} ${{ steps.app.outputs.sha }}"
          echo "url=https://${{ steps.app.outputs.domain }}" >> "$GITHUB_OUTPUT"

      # with_latest: rebuild the app with the preview environment, in this job instead of a second
      # deploy-app run, and deploy it to the fixed link below. This runs even if the prod deploy
      # failed, and a failure here doesn't stop the deployed tag from moving (see the last step).
      - name: Rebuild for the fixed preview link
        id: latest_build
        if: >-
          !cancelled() && steps.app.outputs.type == 'hosting' && inputs.target == 'prod' && inputs.with_latest
        continue-on-error: true
        env:
          VITE_PR_NUMBER: ${{ steps.pr.outputs.number }}
          NEXT_PUBLIC_PR_NUMBER: ${{ steps.pr.outputs.number }}
          VITE_APP_ENV: preview
          VITE_FIRESTORE_DATABASE_ID: ${{ steps.app.outputs.preview_database }}
          NEXT_PUBLIC_APP_ENV: preview
          NEXT_PUBLIC_FIRESTORE_DATABASE_ID: ${{ steps.app.outputs.preview_database }}
        run: '"$RUN" npm run build'

      - name: Deploy Firestore rules (preview database, after a merge)
        id: latest_rules
        if: steps.latest_build.outcome == 'success' && steps.app.outputs.preview_own_database != ''
        continue-on-error: true
        run: |
          "$RUN" npx -y "$FIREBASE_TOOLS" deploy --only 'firestore:${{ steps.app.outputs.preview_own_database }}' \
            --project "$FIREBASE_PROJECT" --force

      # The same build also goes to a fixed "latest" channel, so each app has one preview link that
      # never changes and always shows the most recent preview push from any branch or merge to main
      # (last one wins; prod.yml runs this with latest_only after each merge).
      # Channels last at most 30 days; every deploy resets that, and preview-keepalive.yml extends it weekly.
      # An app with previewSite in app.json gets its fixed link from that site instead (next step).
      - name: Deploy fixed latest channel
        id: hosting_latest
        if: >-
          steps.app.outputs.preview_site == '' && (
            (success() && steps.app.outputs.type == 'hosting' && inputs.target == 'preview')
            || (!cancelled() && steps.latest_build.outcome == 'success'))
        continue-on-error: ${{ inputs.target == 'prod' || !inputs.latest_only }}
        run: |
          npx -y "$FIREBASE_TOOLS" hosting:channel:deploy latest \
            --project "$FIREBASE_PROJECT" --expires 30d --json > "$RUNNER_TEMP/latest.json" 2> "$RUNNER_TEMP/latest.err" || {
            cat "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/latest.err"
            echo "::warning title=latest channel::deploy to the fixed latest channel failed"
            exit 1
          }
          url=$(jq -r '.result | to_entries[0].value.url' "$RUNNER_TEMP/latest.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The fixed link on its own Hosting site, so it can have a custom domain (preview channels can't).
      # The site and domain are set up by create-app.yml. This deploys the same preview build to the
      # site's live channel, which never expires.
      - name: Deploy fixed preview site
        id: hosting_preview_site
        if: >-
          steps.app.outputs.preview_site != '' && (
            (success() && steps.app.outputs.type == 'hosting' && inputs.target == 'preview')
            || (!cancelled() && steps.latest_build.outcome == 'success'))
        continue-on-error: ${{ inputs.target == 'prod' || !inputs.latest_only }}
        env:
          SITE: ${{ steps.app.outputs.preview_site }}
          DOMAIN: ${{ steps.app.outputs.preview_domain }}
        run: |
          cp firebase.json "$RUNNER_TEMP/firebase.json.orig"
          jq --arg s "$SITE" '.hosting.site = $s' "$RUNNER_TEMP/firebase.json.orig" > firebase.json
          status=0
          "$RUN" npx -y "$FIREBASE_TOOLS" deploy --only hosting --project "$FIREBASE_PROJECT" --force \
            --message "${{ inputs.app }} preview ${{ steps.app.outputs.sha }}" || status=$?
          cp "$RUNNER_TEMP/firebase.json.orig" firebase.json
          [ "$status" = 0 ] || { echo "::warning title=preview site::deploy to $SITE failed"; exit "$status"; }
          echo "url=https://${DOMAIN:-$SITE.web.app}" >> "$GITHUB_OUTPUT"

      # Apps with server code on Firebase App Hosting

      # An App Hosting app without a previewBackend in app.json gets no preview.
      - name: Deploy Firestore rules (App Hosting)
        if: >-
          steps.app.outputs.type == 'apphosting' && steps.app.outputs.own_database != '' && !inputs.latest_only
          && (inputs.target == 'prod' || steps.app.outputs.preview_backend != '')
        run: |
          "$RUN" npx -y "$FIREBASE_TOOLS" deploy --only 'firestore:${{ steps.app.outputs.own_database }}' \
            --project "$FIREBASE_PROJECT" --force

      # Cloud Run jobs listed in app.json's "jobs" (see docs/PLAN.md). Each is built from
      # jobs/<name>/Dockerfile, pushed to Artifact Registry and deployed as <app>-<name> for prod or
      # <app>-<name>-preview for previews, before the app rolls out so the app can start it.
      # One-time setup per app: scripts/setup-jobs.sh.
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.app.outputs.jobs != '[]' && !inputs.latest_only

      - name: Cloud Run jobs
        if: steps.app.outputs.jobs != '[]' && !inputs.latest_only
        env:
          APP: ${{ inputs.app }}
          JOBS: ${{ steps.app.outputs.jobs }}
          JOB_SA: ${{ steps.app.outputs.job_service_account }}
          SHA: ${{ steps.app.outputs.sha }}
          SUFFIX: ${{ inputs.target == 'preview' && '-preview' || '' }}
          REGION: us-central1
        run: |
          echo "::notice title=jobs::deploying as $(gcloud config get-value account 2>/dev/null)"
          [ -n "$JOB_SA" ] || { echo "::error::app.json has jobs but no jobServiceAccount"; exit 1; }
          registry="$REGION-docker.pkg.dev"
          "$RUN" gcloud auth configure-docker "$registry" --quiet
          for row in $(echo "$JOBS" | jq -c '.[]'); do
            job=$(jq -r '.name' <<< "$row")
            [[ "$job" =~ ^[a-z][a-z0-9-]{0,30}$ ]] || { echo "::error::Bad job name: $job"; exit 1; }
            [ -f "jobs/$job/Dockerfile" ] || { echo "::error::jobs/$job/Dockerfile not found"; exit 1; }
            image="$registry/$FIREBASE_PROJECT/apps/$APP-$job:$SHA"
            env_vars=$(jq -r --arg t '${{ inputs.target }}' \
              '(.env // {}) + {APP_ENV: $t} | to_entries | map("\(.key)=\(.value)") | join(",")' <<< "$row")
            # Secret Manager secrets as env vars: {"GEMINI_API_KEY": "video-gemini-api-key"}.
            secrets=$(jq -r '(.secrets // {}) | to_entries | map("\(.key)=\(.value):latest") | join(",")' <<< "$row")
            secret_flag=(--clear-secrets)
            [ -z "$secrets" ] || secret_flag=(--set-secrets "$secrets")
            "$RUN" docker build -t "$image" "jobs/$job"
            "$RUN" docker push "$image"
            "$RUN" gcloud run jobs deploy "$APP-$job$SUFFIX" --image "$image" \
              --region "$REGION" --project "$FIREBASE_PROJECT" --service-account "$JOB_SA" \
              --cpu "$(jq -r '.cpu // "1"' <<< "$row")" --memory "$(jq -r '.memory // "2Gi"' <<< "$row")" \
              --task-timeout "$(jq -r '.timeout // "3600s"' <<< "$row")" \
              --tasks 1 --max-retries "$(jq -r '.maxRetries // 1' <<< "$row")" \
              --set-env-vars "$env_vars" "${secret_flag[@]}" --quiet
            echo "::notice title=jobs::$APP-$job$SUFFIX deployed from $image"
          done

      - name: Roll out App Hosting
        id: apphosting
        if: steps.app.outputs.type == 'apphosting' && !inputs.latest_only
        env:
          BRANCH: ${{ inputs.ref || github.ref_name }}
        run: |
          if [ '${{ inputs.target }}' = prod ]; then
            backend='${{ steps.app.outputs.backend }}'
            "$RUN" npx -y "$FIREBASE_TOOLS" apphosting:rollouts:create "$backend" \
              --git-commit '${{ steps.app.outputs.sha }}' --force --project "$FIREBASE_PROJECT"
            echo "url=https://${{ steps.app.outputs.domain }}" >> "$GITHUB_OUTPUT"
          elif [ -z '${{ steps.app.outputs.preview_backend }}' ]; then
            echo "::notice title=${{ inputs.app }}::No previewBackend in app.json, so there is no preview"
            echo "note=no preview backend" >> "$GITHUB_OUTPUT"
          else
            backend='${{ steps.app.outputs.preview_backend }}'
            "$RUN" npx -y "$FIREBASE_TOOLS" apphosting:rollouts:create "$backend" \
              --git-branch "$BRANCH" --force --project "$FIREBASE_PROJECT"
            uri=$(npx -y "$FIREBASE_TOOLS" apphosting:backends:get "$backend" --project "$FIREBASE_PROJECT" --json \
              | jq -r '[.. | objects | .uri? | strings][0] // empty')
            case "$uri" in http*) ;; ?*) uri="https://$uri" ;; esac
            echo "url=$uri" >> "$GITHUB_OUTPUT"
          fi

      # Report

      - name: Report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.hosting_preview.outputs.url || steps.hosting_prod.outputs.url || steps.apphosting.outputs.url || steps.hosting_preview_site.outputs.url || steps.hosting_latest.outputs.url }}
          NOTE: ${{ steps.apphosting.outputs.note }}
          LATEST: ${{ steps.hosting_preview_site.outputs.url || steps.hosting_latest.outputs.url }}
        run: |
          echo "- **${{ inputs.app }}** (${{ inputs.target }}): ${URL:-$NOTE}" >> "$GITHUB_STEP_SUMMARY"
          [ -z "$LATEST" ] || echo "  - fixed link (always the latest preview): $LATEST" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ inputs.app }}: ${URL:-$NOTE}${LATEST:+ (fixed: $LATEST)}"
          mkdir -p "$RUNNER_TEMP/link"
          jq -n --arg app '${{ inputs.app }}' --arg url "$URL" --arg note "$NOTE" --arg latest "$LATEST" \
            '{app: $app, url: $url, note: $note, latest: $latest}' > "$RUNNER_TEMP/link/${{ inputs.app }}.json"
          if [ '${{ inputs.target }}' = preview ] && [ -n "$URL" ] && [ '${{ inputs.latest_only }}' != true ]; then
            gh api "repos/${{ github.repository }}/statuses/${{ steps.app.outputs.sha }}" \
              -f state=success -f context='preview/${{ inputs.app }}' -f target_url="$URL" \
              -f description='Preview deployed' > /dev/null
          fi
          if [ -n "$LATEST" ]; then
            gh api "repos/${{ github.repository }}/statuses/${{ steps.app.outputs.sha }}" \
              -f state=success -f context='preview/${{ inputs.app }} (fixed link)' -f target_url="$LATEST" \
              -f description='Always the latest preview' > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: link-${{ inputs.app }}${{ inputs.latest_only && '-latest' || '' }}
          path: ${{ runner.temp }}/link/${{ inputs.app }}.json
          retention-days: 7

      - name: Move deployed tag
        if: inputs.target == 'prod'
        run: |
          tag='deployed/${{ inputs.app }}'
          git tag -f "$tag" '${{ steps.app.outputs.sha }}'
          git push -f origin "refs/tags/$tag"

      # with_latest: the fixed link steps above don't stop the job, so the tag still moves when only they
      # fail. Fail the job here instead, so the run still shows it.
      - name: Check the fixed preview link
        if: >-
          !cancelled() && inputs.with_latest && (steps.latest_build.outcome == 'failure'
          || steps.latest_rules.outcome == 'failure' || steps.hosting_latest.outcome == 'failure'
          || steps.hosting_preview_site.outcome == 'failure')
        run: |
          echo "::error title=fixed preview link::rebuilding or deploying the fixed latest preview link failed"
          exit 1

      # pr_comment: add this app's links to the branch PR's comment (one comment per PR, updated in
      # place). The first app to finish in a run starts the comment over; the others add their line.
      # Runs when the deploy failed too, so the comment says so.
      - name: PR comment
        if: >-
          !cancelled() && inputs.pr_comment && inputs.target == 'preview' && !inputs.latest_only
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ inputs.app }}
          BRANCH: ${{ inputs.ref || github.ref_name }}
          URL: ${{ steps.hosting_preview.outputs.url || steps.apphosting.outputs.url || steps.hosting_preview_site.outputs.url || steps.hosting_latest.outputs.url }}
          NOTE: ${{ steps.apphosting.outputs.note }}
          LATEST: ${{ steps.hosting_preview_site.outputs.url || steps.hosting_latest.outputs.url }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          marker='<!-- preview-links -->'
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          entry="- **$APP**: ${URL:-${NOTE:-deploy failed, see the run}}"
          [ -z "$LATEST" ] || entry+=$'\n'"  - fixed link (always the latest preview): $LATEST"
          find_comment() {
            gh api "repos/$GH_REPO/issues/$pr/comments" --paginate \
              --jq "map(select(.body | startswith(\"$marker\")) | {id, body} | tojson) | .[]" | head -n1
          }
          for attempt in 1 2 3; do
            found=$(find_comment)
            id=$(jq -r '.id // empty' <<< "${found:-null}")
            old=$(jq -r '.body // empty' <<< "${found:-null}")
            old_run=$(grep -oE 'actions/runs/[0-9]+' <<< "$old" | tail -n1 | cut -d/ -f3 || true)
            # A newer run already owns the comment: leave it alone.
            if [ -n "$old_run" ] && [ "$old_run" -gt "$GITHUB_RUN_ID" ]; then exit 0; fi
            # Keep the other apps' entries from this run, and drop this app's old entry.
            entries=""
            if [ "$old_run" = "$GITHUB_RUN_ID" ]; then
              entries=$(awk -v app="- **$APP**:" '
                /^- \*\*/ { skip = (index($0, app) == 1) }
                /^(- \*\*|  - )/ { if (!skip) print }' <<< "$old")
            fi
            entries="${entries:+$entries$'\n'}$entry"
            body="$marker"$'\n'"**Preview links** for \`${GITHUB_SHA::7}\`"$'\n\n'"$entries"$'\n\n'"[Run]($run_url)"
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
            else
              gh pr comment "$pr" --body "$body" > /dev/null
            fi
            # Another app in this run may have written at the same moment: check that this entry stuck.
            sleep $(( RANDOM % 4 + 2 ))
            now=$(jq -r '.body // empty' <<< "$(find_comment)")
            grep -qF "$run_url" <<< "$now" || exit 0 # a newer run took over
            grep -qxF -- "$(head -n1 <<< "$entry")" <<< "$now" && exit 0
          done
          echo "::warning title=PR comment::could not add $APP to the preview-links comment"
