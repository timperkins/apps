name: preview

# Every push to a branch other than main deploys a preview of each app changed on that branch.
# The "next" branch is left out: deploy-next.yml deploys it straight to prod.
# Links go to the run summary, a commit status per app, and a comment on the branch's PR.
# Each deploy job adds its own app to that comment, so there's no separate links job: Actions bills
# every job as at least a minute, so small jobs around the deploy cost more than they run.

on:
  push:
    branches-ignore: [main, next]

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
      new: ${{ steps.new.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          apps=$(node scripts/changed-apps.mjs --base origin/main)
          echo "Changed apps: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
      - id: new
        run: |
          apps=$(node scripts/new-apps.mjs --base origin/main)
          echo "New apps: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  # An app added on this branch gets its Google resources (site or backends, databases, domain)
  # before its first deploy. create-app is safe to re-run, so every push re-checks them.
  setup:
    needs: detect
    if: needs.detect.outputs.new != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.new) }}
    uses: ./.github/workflows/create-app.yml
    with:
      name: ${{ matrix.name }}
      type: ${{ matrix.type }}
      firestore: ${{ matrix.firestore }}
      ttl_collections: ${{ matrix.ttl_collections }}
      domain: ${{ matrix.domain }}
    secrets: inherit

  deploy:
    needs: [detect, setup]
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.apps != '[]'
      && (needs.setup.result == 'success' || needs.setup.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: ${{ matrix.app }}
      target: preview
      pr_comment: true
    secrets: inherit
    permissions:
      contents: write
      statuses: write
      pull-requests: write
